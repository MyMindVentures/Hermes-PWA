services:
  hermes-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-pwa:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set in Dokploy}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set in Dokploy}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - hermes-dokploy

networks:
  hermes-dokploy:
    driver: bridge

# Dokploy should provide the public domain, HTTPS certificate and deployment
# strategy. Supabase remains an external managed backend; no database container
# is created here.
